  home:
    p1a: "Ik ben David"
    p1b: ". Ik ontwerp huisstijlen en digitale producten."
    p2a: "Ik houd van ingewikkelde materie. Lezen, uitzoeken, schetsen, net zo lang tot het helder is."
    p3a: "Nieuwe tools leer ik graag. Nu is dat vooral AI: daarmee bouw ik zelf apps en prototypes. Eerder werk staat "
