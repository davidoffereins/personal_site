      - { time: "2004—2006", company: "MSc Wirtschaftsgeografie", role: "Rijksuniversiteit Groningen" }
      - { time: "2000—2004", company: "BSc Humangeografie", role: "Rijksuniversiteit Groningen" }
    skills:
      - { time: "Allgemein", role: "Markendesign, UX/UI-Design, Grafikdesign, Datenvisualisierung, Statistik, Typografie, Text, Illustration, Fotografie, Video, 3D-Animation" }
      - { time: "Software", role: "Figma, Photoshop, InDesign, Illustrator, XD, Premiere Pro, After Effects, Blender, Sketch" }
      - { time: "Development", role: "HTML, CSS/SCSS/LESS, Git, Grundkenntnisse Javascript und Vue.js, Bauen mit KI" }
      - { time: "Sprachen", role: "Fließend Niederländisch, Englisch und Deutsch" }
