  work:
    read: "Lees het verhaal"
    cybersprint_meta: "2017—2022 · Merkidentiteit & productontwerp"
    madebyu_meta: "Identiteit & campagne"
    khh_meta: "Identiteit, campagne & website"
    basetide_meta: "Naam & merkidentiteit"
    basetide_text: "Een nieuwe naam en identiteit voor een databaseconsultancy. Base voor de stabiele basis, tide voor de wisselende stroom data. Acht letters op een grid, en vuurtorens als gids."
    pier_meta: "Concept, identiteit & tekst"
    pier_text: "Eerste merkconcept voor de heropening van de Pier in Scheveningen. De vormen komen van maritieme seinvlaggen, de kleuren uit mijn eigen foto's van strand, zee en lucht."
  case:
    meta: "2017—2022 · Ontwerper, later Creative Director"
    lead: "Cybersprint liet organisaties zien wat ze allemaal aan het internet hadden hangen. Ook wat ze zelf vergeten waren. Ik kwam voor een logo en bleef voor het merk en het product."
    product_label: "Het product"
    product_1: "Het begon als een tabel vol assets en risicoscores. Ik maakte er drie niveaus van: een dashboard met wat het eerst moet, een lijst met alles, en een pagina per asset. De eerste versie bouwde ik zelf mee, in HTML en CSS."
    first_caption: "De eerste versie."
    later_caption: "Een paar jaar later: dashboard, assetdetail en Workbench."
    wb_label: "Workbench"
    wb_statement: "Eén scherm om een moeilijke vraag te stellen aan heel veel data."
    wb_prompt: "Query"
    wb_queries: ["risicoscore D of slechter", "draait verouderde software", "nieuw deze week, nog niet toegewezen", "geraakt door de kwetsbaarheid van vandaag"]
    wb_1: "Een idee van oprichter Pieter en mij. Je typt een vraag en de lijst filtert mee terwijl je typt. Een vraag die je vaker stelt, bewaar je. Kwam er een nieuw lek in het nieuws, dan stuurden we klanten een kant-en-klare vraag en zagen zij meteen welke systemen geraakt waren."
    wb_caption: "Zoekvraag bovenin. Bewaarde vragen links. De gefilterde assets eronder."
    net_label: "Het netwerk"
    net_1: "Later kwam er een 3D-kaart bij van de hele attack surface. Elke stip is een asset. Klik erop en je zit in de details."
    story_label: "Het verhaal"
    story_1: "Een bedrijf denkt te weten wat het online heeft staan. Het is altijd meer. Dat verhaal bouwde ik in Blender, in vier beelden."
    story_captions: ["Wat een bedrijf denkt te hebben.", "Verder kijken.", "Wat er werkelijk is.", "En waar een aanval binnenkomt."]
    brand_label: "Het merk"
    brand_1: "Geen hackers in hoodies, geen groene enen en nullen. Zwart, rood, wit en stevige typografie, van het product tot de beursstand. En een luchtfoto van Barcelona die op een printplaat lijkt."
    after_label: "Daarna"
    after_1: "Cybersprint groeide naar zo'n 65 mensen en werd in 2022 overgenomen door Darktrace. Ik bleef nog een jaar als senior UX/UI-ontwerper."
    back: "Al het werk"
