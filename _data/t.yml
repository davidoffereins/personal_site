de:
  prefix: "/de"
  nav: { work: "Arbeiten", cv: "Lebenslauf", contact: "Kontakt", home: "Home" }
  home:
    p1a: "Ich bin David"
    p1b: ". Ich gestalte Marken, digitale Produkte & Printmedien."
    p2a: "Ich mache durchdachtes Design, das funktioniert. Meistens, indem ich kopfüber eintauche: lesen, recherchieren, skizzieren, komplexe Daten verstehen und mir neue Werkzeuge aneignen, wenn es nötig ist. Und am Ende lange an den Details feilen. Frühere Projekte gibt es "
    p2link: "hier"
  work:
    read: "Zur Geschichte"
    cybersprint_meta: "2017—2022 · Markenidentität & Produktdesign"
    madebyu_meta: "Identität & Kampagne"
    khh_meta: "Identität, Kampagne & Website"
    basetide_meta: "Name & Markenidentität"
    basetide_text: "Ein neuer Name und eine neue Identität für eine Datenbankberatung. Base für das stabile Fundament, tide für den wechselnden Datenstrom. Acht Buchstaben im Raster, und Leuchttürme als Wegweiser."
    pier_meta: "Konzept, Identität & Text"
    pier_text: "Erstes Markenkonzept für die Wiedereröffnung der Pier in Scheveningen. Die Formen stammen von maritimen Signalflaggen, die Farben aus meinen eigenen Fotos von Strand, Meer und Himmel."
  case:
    meta: "2017—2022 · Designer, später Creative Director"
    lead: "Cybersprint machte sichtbar, was eine Organisation alles am Internet hängen hat. Auch das, wovon niemand mehr wusste. Ich kam für ein neues Logo und blieb, um die Marke und das Produkt zu gestalten."
    product_label: "Das Produkt"
    product_1: "Am Anfang stand eine Tabelle: eine Liste von Assets, je Asset ein Risikowert, und die Details. Die Frage war, wie ein Security-Team auf einen Blick sieht, wie groß das Problem ist und was zuerst zu tun ist."
    product_2: "Ich habe es auf drei Ebenen gebracht. Ein Dashboard mit den größten Risiken und einer Top Ten der Maßnahmen. Eine Liste aller Assets. Und eine Seite je Asset. Ich habe es gestaltet und den größten Teil des ersten Frontends selbst gebaut, in HTML und CSS, zusammen mit dem Backend-Entwickler."
    first_caption: "Die erste Version."
    later_caption: "Ein paar Jahre später: Dashboard, Asset-Detail und Workbench."
    wb_label: "Workbench"
    wb_statement: "Ein Bildschirm, um sehr vielen Daten eine schwierige Frage zu stellen."
    wb_prompt: "Query"
    wb_queries: ["Risikowert D oder schlechter", "läuft mit veralteter Software", "neu diese Woche, noch nicht zugewiesen", "betroffen von der Schwachstelle von heute"]
    wb_1: "Die Workbench entstand aus einer Idee von Gründer Pieter und mir. Man tippt eine Abfrage, und die Asset-Liste filtert beim Tippen: nach Risikowert, Schwachstelle, eingesetzter Software oder einer Kombination. Eine Frage, die man öfter braucht, speichert man, dann steht sie beim nächsten Mal bereit. Das Ergebnis lässt sich exportieren, um damit weiterzuarbeiten."
    wb_2: "Sie veränderte auch, wie Cybersprint seinen Kunden helfen konnte. Kam eine neue Schwachstelle in die Nachrichten, schickten wir eine fertige Abfrage. Der Kunde öffnete sie und sah sofort, welche eigenen Systeme betroffen waren."
    wb_caption: "Oben die Abfrage. Links die gespeicherten Fragen. Darunter die gefilterten Assets."
    net_label: "Das Netzwerk"
    net_1: "Später kam eine 3D-Ansicht der gesamten Angriffsfläche dazu. Jeder Punkt ist ein Asset, das man anklicken kann, verbunden mit der Liste und der Detailseite."
    story_label: "Die Geschichte"
    story_1: "Ein Unternehmen glaubt, seine Angriffsfläche habe eine bestimmte Größe. In Wirklichkeit ist sie viel größer. Und was man nicht kennt, kann man nicht verteidigen. Ich habe das in 3D gebaut, in Blender, damit sich die Geschichte in wenigen Bildern erzählen lässt."
    story_captions: ["Was ein Unternehmen zu haben glaubt.", "Weiter schauen.", "Was wirklich da ist.", "Und wo ein Angriff hereinkommt."]
    brand_label: "Die Marke"
    brand_1: "Keine Hacker im Kapuzenpulli, kein grüner Binärcode. Schwarz, Rot und Weiß, kräftige Typografie, und ein Luftbild von Barcelona, das wie eine Leiterplatte aussieht, bis man die Autos entdeckt."
    brand_2: "Dieselbe Linie zog sich durch das Produkt, die Website, die Infoblätter, den Messestand und das Büro. Ein kleines Unternehmen, das wie ein großes aussah."
    after_label: "Danach"
    after_1: "Cybersprint wuchs von einer Handvoll Leute auf etwa 65 und wurde 2022 von Darktrace übernommen. Ich blieb noch ein Jahr als Senior UX/UI Designer."
    back: "Alle Arbeiten"
