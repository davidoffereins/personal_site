# Alle teksten van de site, per taal. Pas hier tekst aan; de opmaak staat in _layouts.

en:
  prefix: ""
  nav: { work: "Work", cv: "Curriculum Vitae", contact: "Contact", home: "Home" }
  home:
    p1a: "I'm David"
    p1b: ". I design brands, digital products & print media."
    p2a: "I create thoughtful, effective design. Usually by diving in head first, reading, researching, sketching, making sense of complex data, mastering new tools if needed. And obsessing over details at the end. Check out some past projects "
    p2link: "here"
  work:
    read: "Read the story"
    cybersprint_meta: "2017—2022 · Brand identity & product design"
    madebyu_meta: "Identity & campaign"
    khh_meta: "Identity, campaign & website"
    basetide_meta: "Naming & brand identity"
    basetide_text: "A new name and identity for a database consultancy. Base for the stable foundation, tide for the changing flow of data. Eight letters on a grid, and lighthouses as guides."
    pier_meta: "Concept, identity & copy"
    pier_text: "First brand concept for the reopening of the pier in Scheveningen. The shapes come from maritime signal flags, the colours from my own photos of beach, sea and sky."
  case:
    meta: "2017—2022 · Designer, later Creative Director"
    lead: "Cybersprint mapped everything an organisation has exposed to the internet. Also the things nobody knew were there. I came in to draw a new logo and stayed to design the brand and the product."
    product_label: "The product"
    product_1: "The start was a table: a list of assets, a risk score for each, and the details. The question was how a security team sees at a glance how big the problem is and what to do first."
    product_2: "I brought it down to three levels. A dashboard with the biggest risks and a top ten of actions. A list of all assets. And a page for every single asset. I designed it and built most of the first frontend myself, in HTML and CSS, together with the backend developer."
    first_caption: "The first version."
    later_caption: "A few years later: dashboard, asset detail and Workbench."
    wb_label: "Workbench"
    wb_statement: "One screen to ask a difficult question of a lot of data."
    wb_prompt: "Query"
    wb_queries: ["risk score D or worse", "running outdated software", "new this week, not yet assigned", "hit by today's vulnerability"]
    wb_1: "The Workbench grew out of an idea of founder Pieter and me. You type a query and the asset list filters while you type: on risk score, vulnerability, software in use, or a combination. A question you need more often you save, so it is there the next time. The result can be exported to work with."
    wb_2: "It also changed how Cybersprint helped its customers. When a new vulnerability made the news, we could send a ready-made query. The customer opened it and saw right away which of their own systems were hit."
    wb_caption: "Query on top. Saved questions on the left. The filtered assets below."
    net_label: "The network"
    net_1: "Later we added a 3D view of the whole attack surface. Every dot is an asset you can click, linked to the list and the detail page."
    story_label: "The story"
    story_1: "A company thinks its attack surface has a certain size. In reality it is much bigger. And you can't defend what you don't know. I built this in 3D, in Blender, so the story could be told in a few images."
    story_captions: ["What a company thinks it has.", "Looking further.", "What is really there.", "And where an attack comes in."]
    brand_label: "The brand"
    brand_1: "No hackers in hoodies, no green binary code. Black, red and white, strong type, and an aerial photo of Barcelona that reads as a circuit board until you spot the cars."
    brand_2: "The same line ran through the product, the website, the info sheets, the trade show stand and the office. A small company that looked like a big one."
    after_label: "After"
    after_1: "Cybersprint grew from a handful of people to about 65 and was acquired by Darktrace in 2022. I stayed on for a year as senior UX/UI designer."
    back: "All work"
  cv:
    work_title: "Work experience"
    edu_title: "Education"
    skills_title: "Skills"
    work:
      - { time: "Now", company: "Qbuzz", role: "Bus driver" }
      - { time: "2023—present", company: "Independent designer", role: "AI projects: apps and prototypes, designed and built with AI" }
      - { time: "2022—2023", company: "Darktrace", role: "Senior UX/UI designer" }
      - { time: "2018—2022", company: "Cybersprint", role: "Creative Director. Brand identity and product design.", link: "case", linktext: "Read more" }
      - { time: "2012—2018", company: "Freelance designer", role: "Brand & digital design" }
      - { time: "2012", company: "Vesper", role: "Designer" }
      - { time: "2009—2012", company: "De Wijde Blik Communicatieadvies", role: "Designer" }
      - { time: "2006—2009", company: "Noordelijke Ontwikkelingsmaatschappij", role: "Information manager" }
      - { time: "2006", company: "Bureau Bartels", role: "Junior Consultant" }
    edu:
      - { time: "2009—2013", company: "BA Graphic Design", role: "Royal Academy of Art, The Hague" }
      - { time: "2004—2006", company: "MSc Economic Geography", role: "Rijksuniversiteit Groningen, Groningen" }
      - { time: "2000—2004", company: "BSc Human Geography", role: "Rijksuniversiteit Groningen, Groningen" }
    skills:
      - { time: "General", role: "Brand design, UX/UI design, Graphic design, Datavisualization, Statistics, Typography, Copywriting, Illustration, Photography, Videography, 3D-animation" }
      - { time: "Software", role: "Figma, Photoshop, InDesign, Illustrator, XD, Premiere Pro, After Effects, Blender, Sketch" }
      - { time: "Development", role: "HTML, CSS/SCSS/LESS, Git version control, basic Javascript, basic Vue.js, building with AI" }
      - { time: "Languages", role: "Fluent in Dutch, English and German" }
  contact:
    line1: "I am always looking for interesting projects,"
    line2: "so feel free to get in touch!"

nl:
  prefix: "/nl"
  nav: { work: "Werk", cv: "Curriculum Vitae", contact: "Contact", home: "Home" }
  home:
    p1a: "Ik ben David"
    p1b: ". Ik ontwerp merken, digitale producten & drukwerk."
    p2a: "Ik maak doordacht ontwerp dat werkt. Meestal door er vol in te duiken: lezen, onderzoeken, schetsen, wijs worden uit complexe data en nieuwe tools leren als dat nodig is. En aan het eind eindeloos schaven aan de details. Eerder werk staat "
    p2link: "hier"
  work:
    read: "Lees het verhaal"
    cybersprint_meta: "2017—2022 · Merkidentiteit & productontwerp"
    madebyu_meta: "Identiteit & campagne"
    khh_meta: "Identiteit, campagne & website"
    basetide_meta: "Naam & merkidentiteit"
    basetide_text: "Een nieuwe naam en identiteit voor een databaseconsultancy. Base voor de stabiele basis, tide voor de wisselende stroom data. Acht letters op een grid, en vuurtorens als gids."
    pier_meta: "Concept, identiteit & tekst"
    pier_text: "Eerste merkconcept voor de heropening van de Pier in Scheveningen. De vormen komen van maritieme seinvlaggen, de kleuren uit mijn eigen foto's van strand, zee en lucht."
  case:
    meta: "2017—2022 · Ontwerper, later Creative Director"
    lead: "Cybersprint bracht in kaart wat een organisatie allemaal aan het internet heeft hangen. Ook de dingen waarvan niemand meer wist dat ze er waren. Ik kwam binnen voor een nieuw logo en bleef om het merk en het product te ontwerpen."
    product_label: "Het product"
    product_1: "Het begin was een tabel: een lijst assets, per asset een risicoscore, en de details. De vraag was hoe een securityteam in één oogopslag ziet hoe groot het probleem is en wat het eerst moet."
    product_2: "Ik bracht het terug tot drie niveaus. Een dashboard met de grootste risico's en een top tien van acties. Een lijst met alle assets. En een pagina per asset. Ik ontwierp het en bouwde het grootste deel van de eerste frontend zelf, in HTML en CSS, samen met de backenddeveloper."
    first_caption: "De eerste versie."
    later_caption: "Een paar jaar later: dashboard, assetdetail en Workbench."
    wb_label: "Workbench"
    wb_statement: "Eén scherm om een moeilijke vraag te stellen aan heel veel data."
    wb_prompt: "Query"
    wb_queries: ["risicoscore D of slechter", "draait verouderde software", "nieuw deze week, nog niet toegewezen", "geraakt door de kwetsbaarheid van vandaag"]
    wb_1: "De Workbench kwam voort uit een idee van oprichter Pieter en mij. Je typt een zoekvraag en de lijst met assets filtert terwijl je typt: op risicoscore, kwetsbaarheid, gebruikte software, of een combinatie. Een vraag die je vaker nodig hebt bewaar je, zodat hij er de volgende keer gewoon staat. Het resultaat kun je exporteren om mee aan de slag te gaan."
    wb_2: "Het veranderde ook hoe Cybersprint klanten kon helpen. Kwam er een nieuwe kwetsbaarheid in het nieuws, dan stuurden we een kant-en-klare zoekvraag. De klant opende hem en zag meteen welke eigen systemen geraakt waren."
    wb_caption: "Zoekvraag bovenin. Bewaarde vragen links. De gefilterde assets eronder."
    net_label: "Het netwerk"
    net_1: "Later kwam er een 3D-weergave van de hele attack surface bij. Elke stip is een asset waar je op kunt klikken, gekoppeld aan de lijst en de detailpagina."
    story_label: "Het verhaal"
    story_1: "Een bedrijf denkt dat zijn attack surface een bepaalde omvang heeft. In werkelijkheid is die veel groter. En wat je niet kent, kun je niet verdedigen. Ik bouwde dit in 3D, in Blender, zodat het verhaal in een paar beelden te vertellen was."
    story_captions: ["Wat een bedrijf denkt te hebben.", "Verder kijken.", "Wat er werkelijk is.", "En waar een aanval binnenkomt."]
    brand_label: "Het merk"
    brand_1: "Geen hackers in hoodies, geen groene enen en nullen. Zwart, rood en wit, stevige typografie, en een luchtfoto van Barcelona die eruitziet als een printplaat tot je de auto's ziet."
    brand_2: "Dezelfde lijn liep door het product, de website, de infosheets, de beursstand en het kantoor. Een klein bedrijf dat eruitzag als een groot."
    after_label: "Daarna"
    after_1: "Cybersprint groeide van een handvol mensen naar ongeveer 65 en werd in 2022 overgenomen door Darktrace. Ik bleef nog een jaar als senior UX/UI-ontwerper."
    back: "Al het werk"
