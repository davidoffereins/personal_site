en:
  prefix: ""
  nav: { work: "Work", cv: "Curriculum Vitae", contact: "Contact", home: "Home" }
  home:
    p1a: "I'm David"
    p1b: ". I design brand identities and digital products."
    p2a: "I like complicated subjects. Reading, digging, sketching, until it becomes clear."
    p3a: "I enjoy learning new tools. Right now that is mostly AI: I use it to build my own apps and prototypes. Earlier work is "
    p3link: "here"
  work:
    read: "Read the story"
    cybersprint_meta: "2017—2022 · Brand identity & product design"
    madebyu_meta: "Identity & campaign"
    khh_meta: "Identity, campaign & website"
    basetide_meta: "Naming & brand identity"
    basetide_text: "A new name and identity for a database consultancy. Base for the stable foundation, tide for the changing flow of data. Eight letters on a grid, and lighthouses as guides."
    pier_meta: "Concept, identity & copy"
    pier_text: "First brand concept for the reopening of the pier in Scheveningen. The shapes come from maritime signal flags, the colours from my own photos of beach, sea and sky."
  case:
    meta: "2017—2022 · Designer, later Creative Director"
    lead: "Cybersprint showed organisations everything they had exposed to the internet. Including what they had forgotten. I came in for a logo and stayed for the brand and the product."
    product_label: "The product"
    product_1: "It started as a table full of assets and risk scores. I turned it into three levels: a dashboard with what to do first, a list of everything, and a page for each asset. I helped build the first version myself, in HTML and CSS."
    first_caption: "The first version."
    later_caption: "A few years later: dashboard, asset detail and Workbench."
    wb_label: "Workbench"
    wb_statement: "One screen to ask a difficult question of a lot of data."
    wb_prompt: "Query"
    wb_queries: ["risk score D or worse", "running outdated software", "new this week, not yet assigned", "hit by today's vulnerability"]
    wb_1: "An idea of founder Pieter and me. You type a question and the list filters as you type. A question you ask more often, you save. When a new vulnerability made the news, we sent customers a ready-made question and they saw right away which of their systems were hit."
    wb_caption: "Query on top. Saved questions on the left. The filtered assets below."
    net_label: "The network"
    net_1: "Later came a 3D map of the whole attack surface. Every dot is an asset. Click it and you are in the details."
    story_label: "The story"
    story_1: "A company thinks it knows what it has online. It is always more. I built that story in Blender, in four images."
    story_captions: ["What a company thinks it has.", "Looking further.", "What is really there.", "And where an attack comes in."]
    brand_label: "The brand"
    brand_1: "No hackers in hoodies, no green ones and zeros. Black, red, white and sturdy type, from the product to the trade show stand. And an aerial photo of Barcelona that looks like a circuit board."
    after_label: "After"
    after_1: "Cybersprint grew to about 65 people and was acquired by Darktrace in 2022. I stayed for another year as senior UX/UI designer."
    back: "All work"
  cv:
    work_title: "Work experience"
    edu_title: "Education"
    skills_title: "Skills"
