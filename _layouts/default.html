<!DOCTYPE html>
{%- assign lang = page.lang | default: "en" -%}
{%- assign t = site.data.t[lang] -%}
<html lang="{{ lang }}">

  {%- include head.html -%}

  <body class="{{ page.key | default: 'plain' }}{% if page.key == 'case' %} work{% endif %}">

    <div class="bg" aria-hidden="true"><i></i><i></i><i></i><canvas class="dither"></canvas></div>

    {%- include header.html -%}

    <main class="page-content" aria-label="Content">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>

    {%- include footer.html -%}
    {%- include cloudflare.html -%}
    <script src="{{ "/assets/js/main.js" | relative_url }}"></script>
  </body>

</html>
