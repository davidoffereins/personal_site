{%- assign lang = page.lang | default: "en" -%}
{%- assign t = site.data.t[lang] -%}
<footer class="site-footer">
  <div class="wrapper">
    <div>
      <span>© {{ 'now' | date: '%Y' }} David Offereins</span>
    </div>
    <div class="footer-links">
      {% if page.key == "contact" %}
        <div><a href="{{ t.prefix }}/">{{ t.nav.home }}</a></div>
      {% else %}
        <div><a href="{{ t.prefix }}/contact/">{{ t.nav.contact }}</a></div>
      {% endif %}
    </div>
  </div>
</footer>
