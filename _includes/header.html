{%- assign lang = page.lang | default: "en" -%}
{%- assign t = site.data.t[lang] -%}
<header class="site-header" role="banner">

  <div class="wrapper">

    <div>
      <a href="{{ t.prefix }}/" aria-label="{{ t.nav.home }}"><svg class="svg-icon"><use xlink:href="{{ '/assets/img/home.svg#iconhome' | relative_url }}"></use></svg></a>
    </div>

    <input id="menu-toggle" type="checkbox" />
    <label class='menu-button-container' for="menu-toggle">
      <div class='menu-button'></div>
    </label>
    <ul class="menu">
      <li class="home"><a class="page-link" href="{{ t.prefix }}/">{{ t.nav.home }}</a></li>
      <li><a class="page-link{% if page.key == 'work' or page.key == 'case' %} current{% endif %}" href="{{ t.prefix }}/work/">{{ t.nav.work }}</a></li>
      <li><a class="page-link{% if page.key == 'cv' %} current{% endif %}" href="{{ t.prefix }}/cv/">{{ t.nav.cv }}</a></li>
      <li><a class="page-link{% if page.key == 'contact' %} current{% endif %}" href="{{ t.prefix }}/contact/">{{ t.nav.contact }}</a></li>
      <li class="lang">
        {%- for l in site.data.t -%}
          <a class="page-link lang-link{% if l[0] == lang %} current{% endif %}" href="{{ l[1].prefix }}{{ page.slug | default: '/' }}" hreflang="{{ l[0] }}" lang="{{ l[0] }}">{{ l[0] | upcase }}</a>
        {%- endfor -%}
      </li>
    </ul>

  </div>
</header>
